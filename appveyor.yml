version: 1.0.{build}
skip_non_tags: true
clone_depth: 1
environment:
  GITHUB_TOKEN:
    secure: tUvjufRIPG6IV4pB9jRiNUfgD/Heb1TiwBkYJZvnfSOjDqoTu6d843oxOfZdTxsV
  VERSION: 1.0.0
  NIGHTLY_FILENAME: '?'
  PROJECT_NAME: playground
install:
  - ps: "# pre-build.ps1 - 构建前验证脚本\n\n# 设置错误处理\n$ErrorActionPreference = \"Stop\"\n\n# 函数：记录日志\nfunction Write-Log {\n    param([string]$Message)\n    $timestamp = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\"\n    Write-Host \"[$timestamp] $Message\"\n}\n\n# 函数：调用GitHub API\nfunction Invoke-GitHubAPI {\n    param(\n        [string]$Endpoint,\n        [string]$Method = \"GET\"\n    )\n    \n    $headers = @{\n        \"Authorization\" = \"token $env:GITHUB_TOKEN\"\n        \"Accept\" = \"application/vnd.github.v3+json\"\n        \"User-Agent\" = \"PowerShell-CI-Script\"\n    }\n    \n    try {\n        $response = Invoke-RestMethod -Uri \"https://api.github.com/$Endpoint\" `\n                                      -Method $Method `\n                                      -Headers $headers `\n                                      -ContentType \"application/json\"\n        return $response\n    }\n    catch {\n        Write-Log \"GitHub API调用失败: $($_.Exception.Message)\"\n        exit 1\n    }\n}\n\n# 1. 检查是否由标签触发\nif ($env:APPVEYOR_REPO_TAG_NAME) {\n    Write-Log \"检测到标签触发: $env:APPVEYOR_REPO_TAG_NAME，跳过日常构建\"\n    Exit-AppVeyorBuild\n    return\n}\n\nWrite-Log \"开始构建前验证...\"\n\n# 2. 查询GitHub分支信息\nWrite-Log \"查询GitHub仓库分支...\"\n$branches = Invoke-GitHubAPI -Endpoint \"repos/$env:APPVEYOR_REPO_NAME/branches\"\n\n# 筛选目标分支：main和以feat/fix/refactor/perf开头的分支\n$targetBranches = $branches | Where-Object {\n    $_.name -eq \"main\" -or \n    $_.name -match \"^feat/\" -or \n    $_.name -match \"^fix/\" -or \n    $_.name -match \"^refactor/\" -or \n    $_.name -match \"^perf/\"\n}\n\nif ($targetBranches.Count -eq 0) {\n    Write-Log \"未找到目标分支\"\n    exit 1\n}\n\n# 查找有最新提交的分支\n$latestBranch = $null\n$latestCommitDate = [DateTime]::MinValue\n\nforeach ($branch in $targetBranches) {\n    $commit = Invoke-GitHubAPI -Endpoint \"repos/$env:APPVEYOR_REPO_NAME/commits/$($branch.commit.sha)\"\n    $commitDate = [DateTime]$commit.commit.committer.date\n    \n    if ($commitDate -gt $latestCommitDate) {\n        $latestCommitDate = $commitDate\n        $latestBranch = $branch\n    }\n}\n\nif (-not $latestBranch) {\n    Write-Log \"无法确定最新分支\"\n    exit 1\n}\n\nWrite-Log \"选择分支: $($latestBranch.name) (最新提交: $latestCommitDate)\"\n\n# 3. 检查缓存文件\n$cacheDir = \".ci_cache\\build_marks\"\n$branchCacheFile = Join-Path $cacheDir \"$($latestBranch.name -replace '/', '_').txt\"\n\n# 确保缓存目录存在\nif (-not (Test-Path $cacheDir)) {\n    New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null\n}\n\n# 获取当前分支的最新提交SHA\n$currentSha = $latestBranch.commit.sha\nWrite-Log \"当前最新提交SHA: $currentSha\"\n\n# 检查是否需要构建\n$needBuild = $true\n$skipReason = \"\"\n\nif (Test-Path $branchCacheFile) {\n    $lastBuildSha = Get-Content $branchCacheFile -Raw | ForEach-Object { $_.Trim() }\n    Write-Log \"上次构建提交SHA: $lastBuildSha\"\n    \n    if ($lastBuildSha -eq $currentSha) {\n        # 提交相同，跳过构建\n        $needBuild = $false\n        $skipReason = \"提交未变化\"\n    }\n    else {\n        # 获取两个提交之间的差异\n        try {\n            $compare = Invoke-GitHubAPI -Endpoint \"repos/$env:APPVEYOR_REPO_NAME/compare/$lastBuildSha...$currentSha\"\n            \n            # 检查是否有feat/fix/refactor/perf开头的提交\n            $relevantCommits = $compare.commits | Where-Object {\n                $_.commit.message -match \"^(feat|fix|refactor|perf)(\\(|:|\\s)\" -or\n                $_.commit.message -match \"^(feat|fix|refactor|perf)\\/\"\n            }\n            \n            if ($relevantCommits.Count -eq 0) {\n                $needBuild = $false\n                $skipReason = \"没有相关类型的提交（feat/fix/refactor/perf）\"\n            }\n            else {\n                Write-Log \"找到 $($relevantCommits.Count) 个相关提交，需要构建\"\n            }\n        }\n        catch {\n            Write-Log \"无法比较提交，将进行构建\"\n        }\n    }\n}\nelse {\n    # 缓存文件不存在，检查main分支的最后一次合并\n    if ($latestBranch.name -ne \"main\") {\n        Write-Log \"分支为新分支，检查最近一次合并到main的提交...\"\n        \n        try {\n            # 获取合并到main的提交\n            $searchQuery = [System.Web.HttpUtility]::UrlEncode(\"is:pr is:merged base:main head:$($latestBranch.name)\")\n            $searchResults = Invoke-GitHubAPI -Endpoint \"search/issues?q=$searchQuery&sort=updated&order=desc\"\n            \n            if ($searchResults.total_count -gt 0) {\n                $pr = $searchResults.items[0]\n                $prDetails = Invoke-GitHubAPI -Endpoint \"repos/$env:APPVEYOR_REPO_NAME/pulls/$($pr.number)\"\n                \n                if ($prDetails.merge_commit_sha) {\n                    # 从合并提交开始检查\n                    $compare = Invoke-GitHubAPI -Endpoint \"repos/$env:APPVEYOR_REPO_NAME/compare/$($prDetails.merge_commit_sha)...$currentSha\"\n                    \n                    $relevantCommits = $compare.commits | Where-Object {\n                        $_.commit.message -match \"^(feat|fix|refactor|perf)(\\(|:|\\s)\" -or\n                        $_.commit.message -match \"^(feat|fix|refactor|perf)\\/\"\n                    }\n                    \n                    if ($relevantCommits.Count -eq 0) {\n                        $needBuild = $false\n                        $skipReason = \"从上次合并到main后没有相关类型的提交\"\n                    }\n                }\n            }\n        }\n        catch {\n            Write-Log \"无法查询PR信息，将进行构建\"\n        }\n    }\n}\n\n# 决定是否构建\nif (-not $needBuild) {\n    Write-Log \"跳过构建: $skipReason\"\n    Exit-AppVeyorBuild\n    return\n}\n\n# 设置环境变量供后续步骤使用\n$env:CI_TARGET_BRANCH = $latestBranch.name\n$env:CI_TARGET_SHA = $currentSha\n\nWrite-Log \"构建验证通过，开始处理分支: $($latestBranch.name)\"\n\n# 克隆和检出分支（这里只是标记，实际克隆操作由CI/CD平台执行）\nif ($latestBranch.name -eq \"main\") {\n    Write-Log \"目标分支为main，无需签出\"\n}\nelse {\n    Write-Log \"签出到分支: $($latestBranch.name)\"\n    git checkout -q $latestBranch.name\n}\n\n# 获取构建日期和时间\n$buildDate = Get-Date -Format \"yyyyMMdd\"\n\n# 获取提交SHA前8位\n$shortSha = $currentSha.Substring(0, 8)\n\n# 构建文件名\n$nightlyFileName = \"{0}-{1}-nightly-{2}-{3}.jar\" -f $env:PROJECT_NAME, $env:VERSION, $buildDate, $shortSha\n\n# 设置环境变量供后续使用\n$env:NIGHTLY_FILENAME = $nightlyFileName\n\nWrite-Log \"设置构建产物文件名: $nightlyFileName\"\n\nWrite-Log \"构建前准备完成，开始构建...\""
cache: .ci_cache
build_script:
  - cmd: >-
      md artifacts
      
      copy dont_open\feat001 artifacts\playground-1.0.0.jar
      
      echo "build"
test_script:
  - ps: "# pre-package.ps1 - 打包前重命名脚本\n\n# 设置错误处理\n$ErrorActionPreference = \"Stop\"\n\n# 函数：记录日志\nfunction Write-Log {\n    param([string]$Message)\n    $timestamp = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\"\n    Write-Host \"[$timestamp] $Message\"\n}\n\nWrite-Log \"开始重命名构建产物...\"\n\n# 检查必要的环境变量\nif (-not $env:NIGHTLY_FILENAME) {\n    Write-Log \"错误: NIGHTLY_FILENAME 环境变量未设置\"\n    exit 1\n}\n\nif (-not $env:PROJECT_NAME -or -not $env:VERSION) {\n    Write-Log \"错误: PROJECT_NAME 或 VERSION 环境变量未设置\"\n    exit 1\n}\n\n# 原始文件路径\n$sourceDir = \"artifacts\\\"\n$originalFileName = \"{0}-{1}.jar\" -f $env:PROJECT_NAME, $env:VERSION\n$sourceFilePath = Join-Path $sourceDir $originalFileName\n\n# 目标文件路径\n$targetFilePath = Join-Path $sourceDir $env:NIGHTLY_FILENAME\n\n# 检查源文件是否存在\nif (-not (Test-Path $sourceFilePath)) {\n    Write-Log \"警告: 原始文件不存在: $sourceFilePath\"\n    \n    # 尝试查找可能的变体（如带-classifier的jar）\n    $possibleFiles = Get-ChildItem -Path $sourceDir -Filter \"*.jar\" | Where-Object {\n        $_.Name -match \"^$([regex]::Escape($env:PROJECT_NAME))-$([regex]::Escape($env:VERSION))\"\n    }\n    \n    if ($possibleFiles.Count -eq 0) {\n        Write-Log \"错误: 未找到任何匹配的构建产物\"\n        exit 1\n    }\n    \n    # 选择主jar文件（通常是不带分类器的）\n    $mainJar = $possibleFiles | Where-Object { $_.Name -match \"^$([regex]::Escape($env:PROJECT_NAME))-$([regex]::Escape($env:VERSION))\\.jar$\" }\n    \n    if ($mainJar) {\n        $sourceFilePath = $mainJar.FullName\n        Write-Log \"找到主JAR文件: $sourceFilePath\"\n    }\n    else {\n        # 如果没有精确匹配，使用第一个找到的\n        $sourceFilePath = $possibleFiles[0].FullName\n        Write-Log \"使用找到的JAR文件: $sourceFilePath\"\n    }\n}\n\n# 确保目标目录存在\nif (-not (Test-Path $sourceDir)) {\n    Write-Log \"错误: 构建目录不存在: $sourceDir\"\n    exit 1\n}\n\n# 重命名文件\ntry {\n    Write-Log \"重命名文件:\"\n    Write-Log \"  从: $(Split-Path $sourceFilePath -Leaf)\"\n    Write-Log \"  到: $(Split-Path $targetFilePath -Leaf)\"\n    \n    # 如果目标文件已存在，先删除\n    if (Test-Path $targetFilePath) {\n        Remove-Item -Path $targetFilePath -Force\n        Write-Log \"已删除已存在的目标文件\"\n    }\n    \n    # 执行重命名\n    Rename-Item -Path $sourceFilePath -NewName $env:NIGHTLY_FILENAME -Force\n    Write-Log \"文件重命名成功\"\n    \n    # 可选：创建符号链接指向原始名称（便于其他脚本引用）\n    $symlinkPath = Join-Path $sourceDir $originalFileName\n    if (-not (Test-Path $symlinkPath)) {\n        try {\n            New-Item -ItemType SymbolicLink -Path $symlinkPath -Target $targetFilePath -Force | Out-Null\n            Write-Log \"已创建符号链接: $originalFileName -> $env:NIGHTLY_FILENAME\"\n        }\n        catch {\n            Write-Log \"警告: 无法创建符号链接: $_\"\n        }\n    }\n    \n    # 设置环境变量供后续步骤使用\n    $env:NIGHTLY_FILE_PATH = $targetFilePath\n    Write-Log \"设置文件路径变量: $targetFilePath\"\n}\ncatch {\n    Write-Log \"重命名文件失败: $($_.Exception.Message)\"\n    exit 1\n}\n\nWrite-Log \"打包前处理完成\""
artifacts:
  - path: $(NIGHTLY_FILE_PATH)
    name: test
deploy: off
on_success:
  - ps: "# post-build.ps1 - 构建后清理脚本\n\n# 设置错误处理\n$ErrorActionPreference = \"Continue\"\n\n# 函数：记录日志\nfunction Write-Log {\n    param([string]$Message)\n    $timestamp = Get-Date -Format \"yyyy-MM-dd:ss\"\n    Write-Host \"[$timestamp] $Message\"\n}\n\nWrite-Log \"开始构建后清理...\"\n\n# 1. 保存当前构建的SHA到缓存\n$cacheDir = \".ci_cache\\build_marks\"\n$branchName = $env:CI_TARGET_BRANCH\n$currentSha = $env:CI_TARGET_SHA\n\nif ($branchName -and $currentSha) {\n    # 清理分支名中的特殊字符\n    $safeBranchName = $branchName -replace '/', '_'\n    $branchCacheFile = Join-Path $cacheDir \"$safeBranchName.txt\"\n    \n    # 确保缓存目录存在\n    if (-not (Test-Path $cacheDir)) {\n        New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null\n    }\n    \n    # 保存当前SHA\n    $currentSha | Out-File -FilePath $branchCacheFile -Encoding UTF8 -Force\n    Write-Log \"已保存分支 $branchName 的构建SHA: $currentSha\"\n}\nelse {\n    Write-Log \"警告: 未找到分支或SHA信息，跳过缓存更新\"\n}\n\n# 2. 清理超过30天的缓存文件\nWrite-Log \"开始清理过期缓存文件...\"\n$cutoffDate = (Get-Date).AddDays(-30)\n$deletedCount = 0\n\nif (Test-Path $cacheDir) {\n    $cacheFiles = Get-ChildItem -Path $cacheDir -File\n    \n    foreach ($file in $cacheFiles) {\n        if ($file.LastWriteTime -lt $cutoffDate) {\n            try {\n                Remove-Item -Path $file.FullName -Force\n                Write-Log \"已删除过期缓存文件: $($file.Name)\"\n                $deletedCount++\n            }\n            catch {\n                Write-Log \"删除文件失败 $($file.Name): $($_.Exception.Message)\"\n            }\n        }\n    }\n}\n\nWrite-Log \"清理完成，删除了 $deletedCount 个过期文件\"\n\nWrite-Log \"构建后清理完成\""